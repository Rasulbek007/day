<!DOCTYPE html>
<html lang="kk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Менің жоспарлаушым PRO</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E📒%3C/text%3E%3C/svg%3E">
<style>
:root{--red:#e03e1a;--grn:#2fa516}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:var(--bg) center/cover fixed;color:var(--tx);transition:background .3s}
header{background:var(--hd);color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;box-shadow:0 2px 12px #0005}
nav{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit}
nav button,.btn{border:0;border-radius:10px;padding:8px 13px;cursor:pointer;background:#ffffff22;color:#fff;font-size:14px;transition:.2s}
nav button:hover,.btn:hover{filter:brightness(1.2)}
nav button.on,.btn.pri{background:var(--acc)}
main{padding:14px;max-width:1250px;margin:auto}
h2{margin:8px 0 10px;text-shadow:0 0 6px var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:16px}
.sc{overflow-x:auto;border-radius:10px}
table{border-collapse:collapse;width:100%;background:var(--card)}
th,td{border:1px solid var(--bd);padding:5px 7px;font-size:13px;text-align:left}
input,select,textarea{font:inherit;font-size:13px;padding:5px 7px;border:1px solid var(--bd);border-radius:6px;max-width:100%;background:var(--inp);color:var(--tx)}
input[type=checkbox]{accent-color:var(--acc);width:16px;height:16px}
textarea{width:100%;min-height:60px}
.red th{background:var(--red);color:#fff}.red td{background:var(--redl)}
.grn th{background:var(--grn);color:#fff}.grn td{background:var(--grnl)}
.org th{background:var(--acc);color:#fff}.org td{background:var(--orgl)}
.card{background:var(--card);border-radius:14px;padding:16px;text-align:center;box-shadow:0 4px 14px #0002}
.card b{font-size:24px;display:block;margin-bottom:4px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.bar{height:14px;background:#8884;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);transition:width .4s}
.ok{background:var(--grn)!important;color:#fff}.bad{background:var(--red)!important;color:#fff}
.add{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}.add input[type=number]{width:105px}
.panel{background:var(--card);margin:10px auto;max-width:1220px;padding:14px;border-radius:14px;box-shadow:0 6px 24px #0004;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.panel label{display:flex;flex-direction:column;gap:4px;font-size:13px}
.panel input[type=color]{width:100%;height:36px;padding:2px}
.panel .btn{background:var(--hd)}
.nm{display:flex;gap:4px;min-width:210px}.nm input{flex:1}
#lock{position:fixed;inset:0;background:linear-gradient(135deg,#1f2a44,#e8590c);display:flex;align-items:center;justify-content:center;z-index:99}
#lock>div{background:#fff;color:#222;padding:28px;border-radius:18px;text-align:center;width:310px;box-shadow:0 10px 40px #0006}
#lock input{-webkit-text-security:disc;text-security:disc;width:100%;padding:12px;font-size:20px;text-align:center;margin:12px 0;background:#fff;color:#222}
#msg{color:#c00;min-height:20px;font-size:13px}
body,.card,table,th,td,input,select,textarea,header,.panel{transition:background .4s,color .4s,border-color .4s}
#set{position:fixed;top:112px;right:12px;width:290px;max-height:calc(100vh - 130px);overflow:auto;grid-template-columns:1fr;z-index:20;margin:0}
#set[hidden]{display:none}
#top{position:sticky;top:0;z-index:10}
#mb{position:relative;display:flex;flex-wrap:nowrap;gap:6px;justify-content:flex-start;justify-content:safe center;align-items:center;padding:8px 12px;background:var(--hd);color:#fff;overflow-x:auto;box-shadow:0 3px 10px #0004;scrollbar-width:thin}
#mb input{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:20px;padding:6px 4px;width:78px;text-align:center;font-weight:700;flex-shrink:0}
#mb button{flex-shrink:0;white-space:nowrap;border:1px solid var(--bd);border-radius:20px;padding:6px 12px;cursor:pointer;background:var(--card);color:var(--tx);transition:.2s}
#mb button.on{background:var(--acc);color:#fff;border-color:var(--acc);transform:scale(1.07)}

nav button i{font-style:normal}.ls{display:none}
@media(max-width:700px){
html{-webkit-text-size-adjust:100%}
body{padding-bottom:78px}
header{padding:8px 12px;flex-wrap:nowrap}
header>b{font-size:15px;white-space:nowrap}header>b small{display:none}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--hd);padding:6px 4px calc(6px + env(safe-area-inset-bottom));gap:2px;flex-wrap:nowrap;justify-content:space-around;box-shadow:0 -2px 12px #0006}
nav button{flex:1;min-width:0;padding:5px 1px;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10px;border-radius:10px}
nav button i{font-size:20px;line-height:1.1}
nav button.on{background:var(--acc)}
.lf{display:none}.ls{display:inline}
#mb{padding:6px 10px;gap:5px}
#mb button{padding:5px 11px;font-size:13px}
#mb input{font-size:16px;padding:4px 2px;width:68px}
main{padding:10px}
h2{font-size:19px;margin:6px 0 8px}
input,select,textarea{font-size:16px}
.add input,.add select{flex:1 1 130px;min-width:0}
.add input[type=number]{width:auto;flex:1 1 100px}
input[type=checkbox]{width:22px;height:22px}
th,td{padding:4px 4px}
.hb td:first-child,.hb th:first-child{position:sticky;left:0;z-index:2;min-width:125px!important;max-width:125px;font-size:12px}
.hb td:first-child{box-shadow:2px 0 4px #0003}
.card{padding:12px}.card b{font-size:20px}
.cards{grid-template-columns:repeat(2,1fr);gap:8px}
#set{top:100px;right:8px;width:calc(100vw - 16px);max-height:calc(100vh - 190px)}
.jt,.jt tbody,.jt tr,.jt td{display:block;width:100%}
.jt tr:first-child{display:none}
.jt tr{background:var(--card);margin-bottom:12px;border-radius:12px;padding:6px;border:1px solid var(--bd)}
.jt td{border:0;padding:4px;background:none!important}
.jt td::before{content:attr(data-l);display:block;font-weight:600;font-size:12px;opacity:.7;margin-bottom:2px}
#lock>div{width:min(310px,88vw)}
}

@media(max-width:700px){
.lg{text-align:left;padding:10px 12px;margin-bottom:10px}
.lgi{display:flex;gap:7px;align-items:center;padding:3px 0;font-size:13px;line-height:1.25}
.lgi b{background:var(--acc);color:#fff;border-radius:50%;min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.lgi .nm{min-width:0;flex:1}
.sc.nov{overflow:visible}
.hm{table-layout:fixed}
.hm th,.hm td{padding:3px 0;text-align:center;font-size:11px}
.hm th:first-child,.hm td:first-child{width:36px}
.hm th:last-child,.hm td:last-child{width:42px}
.hm th{position:sticky;top:var(--th,91px);z-index:3}
.hm input[type=checkbox]{width:20px;height:20px;margin:2px 0;vertical-align:middle}
.hm tr.today td{background:color-mix(in srgb,var(--acc) 40%,var(--orgl))!important}
}
</style></head><body>
<div id="lock"><div>
<div style="font-size:42px;background:none;box-shadow:none;padding:0;width:auto">🔐</div>
<h2 id="lt" style="color:#222;text-shadow:none">Кодты енгізіңіз</h2>
<input id="pin" type="text" name="pl-code" inputmode="numeric" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" readonly onfocus="this.removeAttribute('readonly')" data-lpignore="true" data-1p-ignore data-form-type="other" placeholder="••••">
<div id="msg"></div>
<button class="btn pri" style="width:100%;background:#e8590c" onclick="unlock()">Кіру</button>
</div></div>

<div id="top"><header><b>📒 Менің жоспарлаушым <small style="opacity:.6">PRO</small></b>
<nav id="nav"></nav>
<span style="display:flex;gap:6px"><button class="btn" id="tm" onclick="quick()" title="Күн/Түн">🌙</button><button class="btn pri" onclick="$('#set').hidden=!$('#set').hidden" title="Баптаулар">🎨</button>
<button class="btn" onclick="chPin()">🔒</button></span></header>
<div id="mb"></div></div>

<div class="panel" id="set" hidden>
<label>Тема<select id="th" onchange="setT('name',this.value)"></select></label>
<label>Акцент түсі<input type="color" id="ac" oninput="setT('acc',this.value)"></label>
<label>Фон түсі<input type="color" id="bgc" oninput="setT('bg',this.value)"></label>
<label>Фон суреті<input type="file" accept="image/*" onchange="img(this.files[0])"></label>
<label>&nbsp;<button class="btn" onclick="setT('img','');">Суретті алып тастау</button></label>
<label>&nbsp;<button class="btn" onclick="S.theme={name:'light'};save();applyT()">Түстерді қалпына келтіру</button></label>
<label>&nbsp;<button class="btn" onclick="exp()">⬇ Сақтық көшірме</button></label>
<label>Көшірмені жүктеу<input type="file" accept=".json" onchange="imp(this.files[0])"></label>
</div>
<main id="v"></main>

<script>
const $=s=>document.querySelector(s), v=$('#v');
const K='planner_v1', PK='planner_pin';
function nowM(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function nowD(){return nowM()+'-'+String(new Date().getDate()).padStart(2,'0')}
const H=['Күн жоспарын жасау — 5 мин','Өзін-өзі дамыту — 20 мин','Терең жұмыс (Deep Work) — 1-2 сағ','Қаржы есебін тексеру — 2-3 мин','Күнлік KPI жазу — 3-5 мин','Күн қорытындысын жасау — 5-10 мин','Шүкіршілік','23:00 ұйықтау'];
const B=['TikTok / Reels / Shorts','Порно','Қант + фастфуд','Түнде ұйықтамау','Ұзақ стресс','Мақсатсыз өмір'];
let S=JSON.parse(localStorage.getItem(K)||'null')||{};
S=Object.assign({m:{},cur:nowM()},S);
const F=['exp','inc','sl','hb','bad','open','minc','jr','ssc'];
const DEF=()=>({exp:[],inc:[],sl:{},hb:{},bad:{},open:0,minc:0,jr:[],ssc:['','','']});
if(!Object.keys(S.m).length)S.m[S.cur]=Object.assign(DEF(),Object.fromEntries(F.filter(f=>S[f]!==undefined).map(f=>[f,S[f]])));
function load(){const d=Object.assign(DEF(),S.m[S.cur]||{});F.forEach(f=>S[f]=d[f])}
load();
S.hl=S.hl||H.map((n,i)=>({id:i,n}));
S.bl=S.bl||B.map((n,i)=>({id:i,n}));
S.nid=S.nid||100;S.theme=S.theme||{name:'light'};
const ser=()=>JSON.stringify(S,function(k,v){return this===S&&F.includes(k)?undefined:v});
const save=()=>{try{S.m[S.cur]=Object.fromEntries(F.map(f=>[f,S[f]]));localStorage.setItem(K,ser())}catch(e){alert('Жад толды! Суретті алып тастаңыз.')}};
const hash=s=>{let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))>>>0;return String(h)};
const fmt=n=>'₸ '+Math.round(n).toLocaleString('ru-RU');
const sum=a=>a.reduce((s,x)=>s+(+x.a||0),0);

/* ---- ТЕМАЛАР ---- */
const TH={
light:{n:'☀️ Жарық',bg:'#eef1f6',card:'#ffffff',tx:'#1b1f2a',bd:'#2b2f3a',acc:'#e8590c',hd:'#1f2a44',redl:'#fbd5cc',grnl:'#d6f5c8',orgl:'#f9dcb5',inp:'#ffffff'},
dark:{n:'🌙 Қараңғы',bg:'#12151c',card:'#1c212b',tx:'#e8eaf0',bd:'#586075',acc:'#ff8a3d',hd:'#0a0c11',redl:'#4a2118',grnl:'#1d3d1a',orgl:'#43321a',inp:'#262c38'},
ocean:{n:'🌊 Мұхит',bg:'#e3f0f8',card:'#ffffff',tx:'#102a3a',bd:'#2a5d7c',acc:'#0a84c6',hd:'#0b3c5d',redl:'#f9d6d0',grnl:'#d3f0e0',orgl:'#cde5f4',inp:'#ffffff'},
forest:{n:'🌲 Орман',bg:'#e7efe3',card:'#ffffff',tx:'#16281c',bd:'#2c4a35',acc:'#2f8f4e',hd:'#1e3b2a',redl:'#f6d5cc',grnl:'#d4f0c6',orgl:'#dbe9c8',inp:'#ffffff'},
rose:{n:'🌸 Раушан',bg:'#fbeef2',card:'#ffffff',tx:'#3a1424',bd:'#6b2a45',acc:'#d6336c',hd:'#4a1230',redl:'#fbd0d0',grnl:'#d6f0d8',orgl:'#fbd0df',inp:'#ffffff'},
night:{n:'🌌 Түн (көк)',bg:'#0d1330',card:'#161d42',tx:'#e6e9ff',bd:'#4a5590',acc:'#7c8cff',hd:'#070a20',redl:'#47213a',grnl:'#17413a',orgl:'#252d63',inp:'#1e2755'}};
function applyT(){
  const t=S.theme,nm=t.name=='auto'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):t.name,b=TH[nm]||TH.light,r=document.documentElement.style;
  for(const k in b)if(k!='n')r.setProperty('--'+k,b[k]);
  if(t.acc)r.setProperty('--acc',t.acc);
  if(t.bg)r.setProperty('--bg',t.bg);
  document.body.style.backgroundImage=t.img?`url(${t.img})`:'none';
  $('#th').innerHTML=Object.keys(TH).map(k=>`<option value="${k}" ${k==t.name?'selected':''}>${TH[k].n}</option>`).join('');
  if(!$('#th option[value=auto]'))$('#th').insertAdjacentHTML('beforeend','<option value="auto">🔄 Авто (жүйе)</option>');$('#th').value=t.name;$('#tm').textContent=nm=='light'?'🌙':'☀️';$('#ac').value=t.acc||b.acc;$('#bgc').value=t.bg||b.bg;
}
function setT(k,val){
  if(k=='name'){S.theme={name:val}}else S.theme[k]=val;
  save();applyT()}
function img(f){if(!f)return;const r=new FileReader();r.onload=e=>{const im=new Image();im.onload=()=>{
  const k=Math.min(1,1600/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.theme.img=c.toDataURL('image/jpeg',.7);save();applyT()};im.src=e.target.result};r.readAsDataURL(f)}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([(save(),ser())],{type:'application/json'}));a.download='planner-backup.json';a.click()}
function imp(f){if(!f)return;const r=new FileReader();r.onload=e=>{try{S=Object.assign(S,JSON.parse(e.target.result));load();save();applyT();draw();alert('Дайын!')}catch(x){alert('Қате файл')}};r.readAsText(f)}

/* ---- код ---- */
function initLock(){
  if(!CSS.supports('-webkit-text-security','disc')){$('#pin').type='password';$('#pin').autocomplete='new-password'}
  if(!localStorage.getItem(PK))$('#lt').textContent='Жаңа код ойлап табыңыз';
  $('#pin').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});}
function unlock(){
  const p=$('#pin').value,st=localStorage.getItem(PK);
  if(!p){$('#msg').textContent='Кодты жазыңыз';return}
  if(!st)localStorage.setItem(PK,hash(p));
  else if(hash(p)!==st){$('#msg').textContent='Қате код!';$('#pin').value='';return}
  $('#lock').style.display='none';$('#pin').value='';$('#msg').textContent='';}
function chPin(){if(confirm('Кодты өзгертесіз бе? Бет қайта жүктеледі.')){localStorage.removeItem(PK);location.reload()}}

/* ---- деректер ---- */
const EXP=[['Тамақ','n'],['Үй','n'],['Утилиталар','n'],['Тасымалдау','n'],['Денсаулық/медицина','n'],['Үй жануарлары','n'],['Қарыз','n'],['Басқа міндетті шығындар','n'],['Сыйлықтар','w'],['Жеке','w'],['Саяхат','w'],['Басқа','w'],['Арнайы санат','w'],['Жинақтар','s']];
const INC=['Жалақы','Бонус','Қызығушылық','Басқа','Арнаулы санат'];
const isMob=()=>matchMedia('(max-width:700px)').matches;
const TABS=[['uyqi','😴 Ұйқы','Ұйқы'],['may','✅ Әдеттер','Әдет'],['tx','💸 Transactions','Қаржы'],['sum','📊 Summary','Есеп'],['jr','📝 Күнделік','Күнделік'],['stat','📈 Статистика','Стат.']];
let tab='uyqi',ed=false;
function go(t){tab=t;draw()}
function draw(){
  document.documentElement.style.setProperty('--th',($('#top').offsetHeight||91)+'px');
  const sx=document.querySelector('.sc')?.scrollLeft||0;
  $('#nav').innerHTML=TABS.map(t=>{const e=t[1].split(' ')[0],l=t[1].slice(e.length+1);return `<button class="${t[0]==tab?'on':''}" onclick="go('${t[0]}')"><i>${e}</i> <span class="lf">${l}</span><span class="ls">${t[2]}</span></button>`}).join('');
  v.innerHTML=({uyqi:sleep,may:habits,tx:trans,sum:summary,jr:journal,stat:stat})[tab]();mbar();if(tab=='stat')bars();
  if(tab=='sum')pie();
  const s=document.querySelector('.sc');if(s)s.scrollLeft=sx;}

/* ---- ҰЙҚЫ ---- */
function mins(b,w){if(!b||!w)return 0;const [h1,m1]=b.split(':'),[h2,m2]=w.split(':');let d=(+h2*60+ +m2)-(+h1*60+ +m1);if(d<=0)d+=1440;return d}
function sleep(){
  let rows='',tot=0,n=0;
  for(let i=1;i<=dim();i++){
    const r=S.sl[i]||{},m=mins(r.b,r.w);if(m){tot+=m;n++}
    rows+=`<tr><td>${i}</td>
    <td><input type="time" value="${r.b||''}" onchange="setS(${i},'b',this.value)"></td>
    <td><input type="time" value="${r.w||''}" onchange="setS(${i},'w',this.value)"></td>
    <td class="${m?(m>=480?'ok':'bad'):''}">${m?Math.floor(m/60)+':'+String(m%60).padStart(2,'0'):'0'}</td>
    <td><input type="number" min="1" max="5" style="width:55px" value="${r.q||''}" onchange="setS(${i},'q',this.value)"></td>
    <td style="font-size:18px">${r.q?(r.q>=4?'👍':'👎'):''}</td></tr>`}
  return `<h2>Ұйқы трекері</h2><div class="cards"><div class="card"><b>${n?(tot/n/60).toFixed(1):0} сағ</b>орташа ұйқы (мақсат: 8)</div><div class="card"><b>${n}</b>толтырылған күн</div></div>
  <div class="sc"><table class="org"><tr><th>Күн</th><th>Жатқан</th><th>Тұрған</th><th>Сағат</th><th>Баға (1-5)</th><th></th></tr>${rows}</table></div>`}
function setS(i,k,val){(S.sl[i]=S.sl[i]||{})[k]=val;save();draw()}

/* ---- ӘДЕТТЕР (өзгертуге болады) ---- */
function nameCell(l,x,pre){return ed?`<div class="nm"><input value="${x.n.replace(/"/g,'&quot;')}" onchange="rn('${l}',${x.id},this.value)"><button onclick="rm('${l}',${x.id})">🗑</button></div>`:pre+x.n}
function rn(l,id,val){S[l].find(x=>x.id==id).n=val;save()}
function rm(l,id){if(confirm('Өшіресіз бе?')){S[l]=S[l].filter(x=>x.id!=id);save();draw()}}
function ad(l,inp){const n=$('#'+inp).value.trim();if(!n)return;S[l].push({id:S.nid++,n});save();draw()}
function mv(l,i,d){const a=S[l],j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();draw()}
function habits(){
  const L=S.hl;let head='<th>Әдет</th>',pr='',tot=0;
  for(let d=1;d<=dim();d++)head+=`<th>${d}</th>`;
  const rows=L.map((h,i)=>`<tr><td style="min-width:210px">${ed?`<button onclick="mv('hl',${i},-1)">↑</button><button onclick="mv('hl',${i},1)">↓</button>`:''}${nameCell('hl',h,'')}</td>`+
    [...Array(dim())].map((_,k)=>{const d=k+1,c=S.hb[h.id+'_'+d];if(c)tot++;return `<td><input type="checkbox" ${c?'checked':''} onchange="tg('hb','${h.id}_${d}',this.checked)"></td>`}).join('')+'</tr>').join('');
  for(let d=1;d<=dim();d++){let c=0;L.forEach(h=>{if(S.hb[h.id+'_'+d])c++});pr+=`<td>${L.length?Math.round(c/L.length*100):0}%</td>`}
  const p=L.length?Math.round(tot/(L.length*dim())*100):0;
  let tbl=`<div class="sc"><table class="org hb"><tr>${head}</tr>${rows}<tr><td><b>Progress %</b></td>${pr}</tr></table></div>`;
  if(isMob()){
    const n=dim(),td=S.cur==nowM()?new Date().getDate():0;
    let r='';
    for(let d=1;d<=n;d++){let c=0;const cells=L.map(x=>{const on=S.hb[x.id+'_'+d];if(on)c++;return `<td><input type="checkbox" ${on?'checked':''} onchange="tg('hb','${x.id}_${d}',this.checked)"></td>`}).join('');
      r+=`<tr class="${d==td?'today':''}"><td><b>${d}</b></td>${cells}<td>${L.length?Math.round(c/L.length*100):0}%</td></tr>`}
    const ft=L.map(x=>{let c=0;for(let d=1;d<=n;d++)if(S.hb[x.id+'_'+d])c++;return `<td>${Math.round(c/n*100)}%</td>`}).join('');
    const lg=L.map((h,i)=>`<div class="lgi"><b>${i+1}</b>${ed?`<button onclick="mv('hl',${i},-1)">↑</button><button onclick="mv('hl',${i},1)">↓</button>`:''}${nameCell('hl',h,'')}</div>`).join('');
    tbl=`<div class="card lg">${lg}</div><div class="sc nov"><table class="org hm"><tr><th>Күн</th>${L.map((_,i)=>`<th>${i+1}</th>`).join('')}<th>%</th></tr>${r}<tr><td><b>%</b></td>${ft}<td><b>${p}%</b></td></tr></table></div>`}
  const brows=S.bl.map(b=>`<tr><td>${nameCell('bl',b,'❌ ')}</td>`+[1,2,3,4,5,6,7].map(d=>`<td><input type="checkbox" ${S.bad[b.id+'_'+d]?'checked':''} onchange="tg('bad','${b.id}_${d}',this.checked)"></td>`).join('')+'</tr>').join('');
  return `<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap"><h2>Күнделікті әдеттер</h2>
  <button class="btn ${ed?'pri':''}" style="background:${ed?'':'var(--hd)'}" onclick="ed=!ed;draw()">${ed?'✔ Дайын':'✏️ Әдеттерді өзгерту'}</button></div>
  <div class="card" style="margin-bottom:12px"><b>${p}%</b>айлық прогресс<div class="bar"><i style="width:${p}%"></i></div></div>
  ${tbl}
  ${ed?`<div class="add" style="margin-top:8px"><input id="nh" placeholder="Жаңа әдет атауы"><button class="btn pri" onclick="ad('hl','nh')">＋ Әдет қосу</button></div>`:''}
  <h2>Зиянды әдеттер (7 күн)</h2><div class="sc"><table class="org" style="width:auto"><tr><th>Күндер</th>${[1,2,3,4,5,6,7].map(d=>`<th>${d}</th>`).join('')}</tr>${brows}</table></div>
  ${ed?`<div class="add" style="margin-top:8px"><input id="nb" placeholder="Жаңа зиянды әдет"><button class="btn pri" onclick="ad('bl','nb')">＋ Қосу</button></div>`:''}
  <h2>Stop / Start / Continue</h2><div class="grid">${['Stop (тоқтат)','Start (баста)','Continue (жалғастыр)'].map((t,i)=>`<div><b>${t}</b><textarea style="min-height:140px" oninput="S.ssc[${i}]=this.value;save()">${S.ssc[i]||''}</textarea></div>`).join('')}</div>`}
function tg(o,k,c){if(c)S[o][k]=1;else delete S[o][k];save();draw()}

/* ---- TRANSACTIONS ---- */
function trans(){return `<div class="grid">${box('exp','Шығындар','red',EXP.map(x=>x[0]))}${box('inc','Кіріс','grn',INC)}</div>`}
function box(k,t,cl,cats){
  const t0=nowD(),today=t0.slice(0,7)==S.cur?t0:S.cur+'-01';
  const rows=S[k].map((r,i)=>`<tr><td>${r.d.split('-').reverse().join('.')}</td><td>${fmt(r.a)}</td><td>${r.n||''}</td><td>${r.c}</td><td><button onclick="del('${k}',${i})">✕</button></td></tr>`).join('');
  return `<div><h2>${t}</h2><div class="add">
  <input type="date" id="${k}d" value="${today}"><input type="number" id="${k}a" placeholder="Сома">
  <input id="${k}n" placeholder="Сипаттама"><select id="${k}c">${cats.map(c=>`<option>${c}</option>`).join('')}</select>
  <button class="btn pri" onclick="add('${k}')">＋</button></div>
  <div class="sc"><table class="${cl}"><tr><th>Күн</th><th>Сома</th><th>Сипаттама</th><th>Санат</th><th></th></tr>${rows}</table></div></div>`}
function add(k){const a=+$('#'+k+'a').value;if(!a)return;S[k].push({d:$('#'+k+'d').value,a,n:$('#'+k+'n').value,c:$('#'+k+'c').value});save();draw()}
function del(k,i){S[k].splice(i,1);save();draw()}

/* ---- SUMMARY ---- */
function by(k,c){return sum(S[k].filter(x=>x.c==c))}
function grp(g){return EXP.filter(x=>x[1]==g).reduce((s,x)=>s+by('exp',x[0]),0)}
function summary(){
  const ti=sum(S.inc),te=sum(S.exp),end=(+S.open||0)+ti-te,base=+S.minc||ti;
  const G=[['n','50% — Міндетті шығындар',.5,'#e03e1a'],['w','30% — Қалау, рахатқа жұмсайтын ақша',.3,'#f0d23c'],['s','20% — Жинақ және инвестиция',.2,'#4cc22a']];
  const rule=G.map(g=>{const a=grp(g[0]),t=base*g[2];return `<tr><td style="background:${g[3]};color:#111">${g[1]}</td><td>${fmt(t)}</td><td class="${a>t?'bad':''}">${fmt(a)}</td></tr>`}).join('');
  return `<h2>Қорытынды</h2>
  <div class="cards"><div class="card"><b><input type="number" style="width:130px;font-size:18px" value="${S.open||''}" placeholder="0" onchange="S.open=this.value;save();draw()"></b>БАСТАУ БАЛАНС</div>
  <div class="card"><b>${fmt(ti)}</b>Кіріс</div><div class="card"><b>${fmt(te)}</b>Шығын</div>
  <div class="card"><b style="color:${end<0?'var(--red)':'var(--grn)'}">${fmt(end)}</b>АЯҚТА БАЛАНС</div></div>
  <div class="grid"><div><h2>Шығындар</h2><div class="sc"><table class="red"><tr><th>Санат</th><th>Нақты</th></tr>${EXP.map(x=>`<tr><td>${x[0]}</td><td>${fmt(by('exp',x[0]))}</td></tr>`).join('')}</table></div></div>
  <div><h2>Кіріс</h2><div class="sc"><table class="grn"><tr><th>Санат</th><th>Нақты</th></tr>${INC.map(x=>`<tr><td>${x}</td><td>${fmt(by('inc',x))}</td></tr>`).join('')}</table></div>
  <h2>50 / 30 / 20 ережесі</h2><p>Айлық табыс: <input type="number" style="width:130px" value="${S.minc||''}" placeholder="${ti}" onchange="S.minc=this.value;save();draw()"></p>
  <div class="sc"><table><tr><th>Топ</th><th>Мақсат</th><th>Нақты</th></tr>${rule}</table></div>
  <canvas id="pie" width="240" height="240" style="display:block;margin:14px auto"></canvas></div></div>`}
function pie(){
  const c=$('#pie').getContext('2d'),d=[grp('n'),grp('w'),grp('s')],col=['#e03e1a','#f0d23c','#4cc22a'],t=d[0]+d[1]+d[2];
  if(!t){c.fillStyle='#8886';c.beginPath();c.arc(120,120,100,0,7);c.fill();return}
  let a=-Math.PI/2;d.forEach((x,i)=>{const e=a+x/t*Math.PI*2;c.fillStyle=col[i];c.beginPath();c.moveTo(120,120);c.arc(120,120,100,a,e);c.fill();a=e})}

/* ---- КҮНДЕЛІК ---- */
const JC=['Күннің эмоциялары','Не үйрендің / көрген инсайт','Кішкентай жеңістер','Шығармашылық / идеялар','Рефлексия','Алғыс айту / гридация'];
function journal(){
  if(!S.jr.length)S.jr.push(['','','','','','']);
  return `<h2>Күнделік</h2><button class="btn pri" onclick="S.jr.push(['','','','','','']);save();draw()">＋ Жаңа жол</button>
  <div class="sc" style="margin-top:8px"><table class="jt"><tr>${JC.map(c=>`<th>${c}</th>`).join('')}</tr>
  ${S.jr.map((r,i)=>'<tr>'+r.map((x,j)=>`<td data-l="${JC[j]}"><textarea oninput="S.jr[${i}][${j}]=this.value;save()">${x}</textarea></td>`).join('')+'</tr>').join('')}</table></div>`}

/* ---- АЙЛАР ---- */
const MN=['Қаңтар','Ақпан','Наурыз','Сәуір','Мамыр','Маусым','Шілде','Тамыз','Қыркүйек','Қазан','Қараша','Желтоқсан'];
const dim=()=>{const[y,m]=S.cur.split('-');return new Date(y,m,0).getDate()};
const hasD=k=>{const d=S.m[k];return d&&(d.exp.length||d.inc.length||Object.keys(d.hb).length||Object.keys(d.sl).length||d.jr.some(r=>r.some(x=>x)))};
function mbar(){const y=+S.cur.slice(0,4),mb=$('#mb');
  mb.innerHTML=`<button onclick="setM((${y}-1)+'-'+S.cur.slice(5))">◀</button><input type="number" min="2000" max="2100" value="${y}" title="Жылды өзгерту" onchange="setY(this.value)"><button onclick="setM((${y}+1)+'-'+S.cur.slice(5))">▶</button>`+
  MN.map((n,i)=>{const k=y+'-'+String(i+1).padStart(2,'0');return `<button class="${k==S.cur?'on':''}" onclick="setM('${k}')">${n}${hasD(k)?' •':''}</button>`}).join('')+
  `<button onclick="setM(nowM())" title="Қазіргі айға өту">📅 Бүгін</button>`;
  const o=mb.querySelector('.on');if(o)mb.scrollLeft=o.offsetLeft-mb.clientWidth/2+o.offsetWidth/2}
function setY(val){val=parseInt(val);if(!(val>=2000&&val<=2100)){draw();return}setM(val+'-'+S.cur.slice(5))}
function rollM(){const n=nowM();if(S.cur!==n){save();S.cur=n;load();save()}}
function setM(k){save();S.cur=k;load();save();draw()}
function quick(){S.theme.name=(S.theme.name=='dark')?'light':'dark';delete S.theme.bg;save();applyT()}
/* ---- СТАТИСТИКА ---- */
const k1=v=>Math.round(v/1000)+'k';
const MT=[['ti','Кіріс',fmt,k1],['te','Шығын',fmt,k1],['net','Қалдық',fmt,k1],['sl','Орташа ұйқы (сағ)',x=>x.toFixed(1),x=>x.toFixed(1)],['hp','Әдеттер %',x=>Math.round(x)+'%',x=>Math.round(x)+'%'],['bd','Зиянды әдет белгілері',x=>x,x=>x],['jr','Күнделік жазбалары',x=>x,x=>x]];
let sm_='te',ca=null,cb=null;
function ms(k){const d=S.m[k];if(!d)return null;const[y,m]=k.split('-'),dm=new Date(y,m,0).getDate(),ti=sum(d.inc),te=sum(d.exp);
  let a=0,n=0;for(const i in d.sl){const x=mins(d.sl[i].b,d.sl[i].w);if(x){a+=x;n++}}
  const hc=S.hl.reduce((s,h)=>{for(let i=1;i<=dm;i++)if(d.hb[h.id+'_'+i])s++;return s},0);
  return{ti,te,net:ti-te,sl:n?a/n/60:0,hp:S.hl.length?hc/(S.hl.length*dm)*100:0,bd:Object.keys(d.bad).length,jr:d.jr.filter(r=>r.some(x=>x)).length}}
function stat(){
  const y=S.cur.slice(0,4),ks=MN.map((_,i)=>y+'-'+String(i+1).padStart(2,'0')),R=ks.map(ms);
  ca=y+(ca||S.cur).slice(4);cb=y+(cb||ks[Math.max(0,+S.cur.slice(5)-2)]).slice(4);
  const opt=s=>ks.map((k,i)=>`<option value="${k}" ${k==s?'selected':''}>${MN[i]}</option>`).join('');
  const A=ms(ca),Bm=ms(cb);
  const cmp=MT.map(m=>{const a=A?A[m[0]]:0,b=Bm?Bm[m[0]]:0,d=a-b,low=m[0]=='te'||m[0]=='bd',cl=d==0?'':((low?d<0:d>0)?'ok':'bad');
    return `<tr><td>${m[1]}</td><td>${m[2](a)}</td><td>${m[2](b)}</td><td class="${cl}">${d>0?'+':''}${m[2](d)}</td></tr>`}).join('');
  const rows=ks.map((k,i)=>`<tr><td>${MN[i]}</td>`+MT.map(m=>`<td>${R[i]?m[2](R[i][m[0]]):'—'}</td>`).join('')+'</tr>').join('');
  return `<h2>Статистика — ${y}</h2>
  <div class="add">${MT.map(m=>`<button class="btn ${m[0]==sm_?'pri':''}" style="${m[0]==sm_?'':'background:var(--hd)'}" onclick="sm_='${m[0]}';draw()">${m[1]}</button>`).join('')}</div>
  <div class="card"><canvas id="bc" width="720" height="270" style="width:100%;max-width:720px"></canvas></div>
  <h2>Айларды салыстыру</h2>
  <div class="add"><select onchange="ca=this.value;draw()">${opt(ca)}</select><b style="padding:5px">vs</b><select onchange="cb=this.value;draw()">${opt(cb)}</select></div>
  <div class="sc"><table class="org"><tr><th>Көрсеткіш</th><th>${MN[+ca.slice(5)-1]}</th><th>${MN[+cb.slice(5)-1]}</th><th>Айырма</th></tr>${cmp}</table></div>
  <h2>Жыл кестесі</h2><div class="sc"><table class="org"><tr><th>Ай</th>${MT.map(m=>`<th>${m[1]}</th>`).join('')}</tr>${rows}</table></div>`}
function bars(){
  const c=$('#bc'),x=c.getContext('2d'),y=S.cur.slice(0,4),cs=getComputedStyle(document.documentElement),acc=cs.getPropertyValue('--acc').trim(),tx=cs.getPropertyValue('--tx').trim();
  const m=MT.find(a=>a[0]==sm_),vals=MN.map((_,i)=>{const r=ms(y+'-'+String(i+1).padStart(2,'0'));return r?Math.max(0,r[sm_]):0}),mx=Math.max(...vals,1);
  x.clearRect(0,0,720,270);x.font='11px sans-serif';x.textAlign='center';
  vals.forEach((v,i)=>{const w=44,X=10+i*58,h=v/mx*190;
    x.globalAlpha=i+1==+S.cur.slice(5)?1:.55;x.fillStyle=acc;x.fillRect(X,225-h,w,h);
    x.globalAlpha=1;x.fillStyle=tx;x.fillText(m[3](v),X+w/2,219-h);x.fillText(MN[i].slice(0,3),X+w/2,245)})}
rollM();initLock();applyT();draw();
let lm_=isMob();addEventListener('resize',()=>{const m=isMob();if(m!==lm_){lm_=m;draw()}else document.documentElement.style.setProperty('--th',$('#top').offsetHeight+'px')});
let rm_=nowM();setInterval(()=>{const n=nowM();if(n!==rm_){rm_=n;setM(n)}},60000);
</script></body></html>
